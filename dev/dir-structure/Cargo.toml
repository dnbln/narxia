[package]
name = "dir-structure"
version = "0.1.5"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Simple crate to create directory structures."
repository = "https://github.com/dnbln/narxia/tree/trunk/dev/dir-structure"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["json", "tokio", "resolve-path"]
json = ["dep:serde", "dep:serde_json"]
toml = ["dep:serde", "dep:toml"]
yaml = ["dep:serde", "dep:serde_yaml"]
ron = ["dep:serde", "dep:ron"]
async = ["dep:pin-project", "dir-structure-macros/async"]
tokio = ["dep:tokio", "async"]
resolve-path = ["dir-structure-macros/resolve-path"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[dependencies]
dir-structure-macros.workspace = true
thiserror.workspace = true
pin-project = {workspace = true, optional = true}
ron = { version = "0.8", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["fs"] }

[[test]]
name = "async_tests"
path = "tests/async_tests.rs"
required-features = ["async", "tokio"]