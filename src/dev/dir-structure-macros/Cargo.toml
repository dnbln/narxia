[package]
name = "dir-structure-macros"
version = "0.2.0-rc.3"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "dir-structure: proc-macros"
repository = "https://github.com/dnbln/narxia/tree/trunk/src/dev/dir-structure-macros"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[features]
async = []
resolve-path = []
include_dir_vfs = ["dep:include_dir_macros"]

[dependencies]
quote.workspace = true
syn.workspace = true
proc-macro2.workspace = true
include_dir_macros = { package = "include_dir_macros", version = "0.7", optional = true }

[lints]
workspace = true
