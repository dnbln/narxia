[package]
name = "dir-structure"
version = "0.2.0-rc.1"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Simple crate to create and model directory structures."
repository = "https://github.com/dnbln/narxia/tree/trunk/dev/dir-structure"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["async"]
json = ["dep:serde", "dep:serde_json"]
toml = ["dep:serde", "dep:toml"]
yaml = ["dep:serde", "dep:serde_yaml"]
ron = ["dep:serde", "dep:ron"]
async = ["dep:pin-project", "dep:futures-core", "dir-structure-macros/async"]
tokio = ["dep:tokio", "async"]
include_dir = ["dep:include_dir"]
resolve-path = ["dir-structure-macros/resolve-path"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[dependencies]
dir-structure-macros.workspace = true
futures-core = { version = "0.3", optional = true, default-features = false }
thiserror.workspace = true
pin-project = {workspace = true, optional = true }
ron = { version = "0.8", optional = true, default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", optional = true, default-features = false, features = ["std"] }
serde_yaml = { version = "0.9", optional = true, default-features = false }
toml = { version = "0.8", optional = true, default-features = false, features = ["display", "parse"] }
tokio = { version = "1", optional = true, default-features = false, features = ["fs"] }
include_dir = { version = "0.6", optional = true, default-features = false }

[[test]]
name = "async_tests"
path = "tests/async_tests.rs"
required-features = ["async", "tokio"]

[lints]
workspace = true
