[workspace]
members = [
    "src/compiler/*",
    "src/dev/dir-structure/dir-structure*",
    "src/dev/git-journey",
    "src/dev/git-voyage",
    "src/dev/narxia-workspace",
    "src/dev/nexus",
    "src/dev/assert_eq*",
    "src/dev/doc-extract",
    "src/dev/cargo-guard",
]
default-members = ["src/dev/cargo-guard"]
resolver = "2"

[workspace.package]
version = "0.0.0"
publish = false
edition = "2024"
homepage = "https://nrx.dnbln.dev/"
repository = "https://github.com/dnbln/narxia"
description = "A programming language for distributed systems."
keywords = ["narxia", "programming-language"]
license = "MIT OR Apache-2.0"

[profile.release]
debug = true

[profile.dev.package."rowan"]
opt-level = 3

[profile.dev.package."libtest-mimic"]
opt-level = 3

[profile.dev.package."narxia-syn"]
opt-level = 3

[workspace.dependencies]
narxia-codegen = { path = "src/compiler/narxia-codegen" }
narxia-codegen-llvm = { path = "src/compiler/narxia-codegen-llvm" }
narxia-data-structures = { path = "src/compiler/narxia-data-structures" }
narxia-workspace = { path = "src/dev/narxia-workspace" }
narxia-driver = { path = "src/compiler/narxia-driver" }
narxia-hir = { path = "src/compiler/narxia-hir" }
narxia-hir-lower = { path = "src/compiler/narxia-hir-lower" }
narxia-hir-db = { path = "src/compiler/narxia-hir-db" }
narxia-hir-typechk = { path = "src/compiler/narxia-hir-typechk" }
narxia-hiri = { path = "src/compiler/narxia-hiri" }
narxia-log = { path = "src/compiler/narxia-log" }
narxia-log-impl = { path = "src/compiler/narxia-log-impl" }
narxia-proc = { path = "src/compiler/narxia-proc" }
narxia-src-db = { path = "src/compiler/narxia-src-db" }
narxia-src-db-impl = { path = "src/compiler/narxia-src-db-impl" }
narxia-ssa = { path = "src/compiler/narxia-ssa" }
narxia-ssa-lower = { path = "src/compiler/narxia-ssa-lower" }
narxia-ssa-validator = { path = "src/compiler/narxia-ssa-validator" }
narxia-syn = { path = "src/compiler/narxia-syn" }
narxia-syn-db = { path = "src/compiler/narxia-syn-db" }

assert_eq_macros = { path = "src/dev/assert_eq_macros", version = "=0.2.0" }
assert_eq = { path = "src/dev/assert_eq", version = "0.2.0" }
doc-extract = { path = "src/dev/doc-extract" }

dir-structure-macros = { path = "src/dev/dir-structure/dir-structure-macros", version = "=0.3.0", default-features = false }
dir-structure = { path = "src/dev/dir-structure/dir-structure", version = "=0.3.0", default-features = false }
dir-structure-tools = { path = "src/dev/dir-structure/dir-structure-tools", version = "=0.3.0", default-features = false }
dir-structure-include-dir-vfs = { path = "src/dev/dir-structure/dir-structure-include-dir-vfs", version = "=0.3.0", default-features = false }
dir-structure-git-vfs = { path = "src/dev/dir-structure/dir-structure-git-vfs", version = "=0.3.0", default-features = false }
dir-structure-resolve-core = { path = "src/dev/dir-structure/dir-structure-resolve-core", version = "=0.3.0", default-features = false }

git-journey = { path = "src/dev/git-journey", version = "0.1.0" }
git-voyage = { path = "src/dev/git-voyage", version = "0.1.0" }

bumpalo = "3.20.2"
bytes = "1.11.1"
cargo_metadata = "0.23.1"
nextest-metadata = "0.14.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.2"
clap_mangen = "0.3.0"
criterion = { version = "0.8", features = ["html_reports"] }
bitflags = "2"
dashmap = "6.1.0"
drop_bomb = "0.1.5"
futures = { version = "0.3", default-features = false }
human-panic = "2.0.6"
humantime = "2.3.0"
git2 = { version = "0.20", default-features = false }
libc = "0.2"
libtest-mimic = "0.8.2"
llvm-sys = { version = "221.0.1", default-features = false }
miette = { version = "7.2.0", features = ["fancy"] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
path-absolutize = "3.1.1"
pin-project = { version = "1", default-features = false }
prodash = { version = "31.0.0", default-features = false, features = [
    "render-line",
    "render-line-crossterm",
    "render-line-autoconfigure",
    "progress-tree",
] }
reqwest = { version = "0.13.2", features = ["blocking"] }
rowan = "0.16.1"
salsa = { path = "src/compiler/narxia-salsa" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.1"
smallvec = "1.10.0"
tar = "0.4"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
liblzma = "0.4.6"
zip = "8"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
annotate-snippets = "0.12.12"

[workspace.lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_unsafe = "deny"
mismatched_lifetime_syntaxes = "deny"
stable_features = "deny"


[workspace.lints.clippy]
absolute_paths = "deny"
alloc_instead_of_core = "deny"
allow_attributes = "deny"
suspicious = { level = "deny", priority = -1 }
style = "deny"
useless_format = "deny"
