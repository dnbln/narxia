name: Guide PR Merged
on:
  pull_request:
    types: [closed]
    branches: ["trunk"]

env:
  CARGO_TERM_COLOR: always
  COLOR: always
  NEXUS_GROUP_BEGIN: "::group::{group}"
  NEXUS_GROUP_END: "::endgroup::"

permissions:
  contents: write

jobs:
  if_merged:
    name: Merge original PR
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'update-guides/')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout core repo
      uses: actions/checkout@v4
      with:
        ref: trunk
    - name: Get PR number
      run: echo "PR_NUMBER=$(echo ${{ github.head_ref }} | awk -F/ '{print $NF}')" >> $GITHUB_ENV
    - name: Get branch names
      uses: ./.github/actions/branches-by-pr
      id: branch-names
      with:
        pr-id: ${{ env.PR_NUMBER }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Checkout guide branch
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.branch-names.outputs.head }}
        path: guide
    - name: Update guide
      run: |
        cd guide
        git switch -C ${{ steps.branch-names.outputs.base }}
        git branch
        git reset --hard ${{ steps.branch-names.outputs.head }} --
        git push origin ${{ steps.branch-names.outputs.base }} --force
        git push origin --delete ${{ github.event.pull_request.head.ref }}
        git push origin --delete ${{ steps.branch-names.outputs.head }} || true

  