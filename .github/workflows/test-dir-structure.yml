name: Dir-Structure Tests

on:
  push:
    branches: ["trunk"]
    paths:
      - 'src/dev/dir-structure/**'
      - 'src/dev/dir-structure-macros/**'
      - 'doc/docs/content/docs/dev/dir-structure/*.doctests'
      - '.github/workflows/test-dir-structure.yml'
  pull_request:
    branches: ["trunk"]
    paths:
      - 'src/dev/dir-structure/**'
      - 'src/dev/dir-structure-macros/**'
      - 'doc/docs/content/docs/dev/dir-structure/*.doctests'
      - '.github/workflows/test-dir-structure.yml'

env:
  CARGO_TERM_COLOR: always
  COLOR: always
  NEXUS_GROUP_BEGIN: "::group::{group}"
  NEXUS_GROUP_END: "::endgroup::"
  CC: clang
  CXX: clang++

jobs:
  test:
    name: Test dir-structure
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature-combos: [
            "--features default",
            "--features async",
            "--features tokio",
            "--features image",
            "--features image,image-format-png",
            "--features image,image-format-jpeg",
            "--features async,image",
            "--features tokio,image",
            "--features tokio,image,image-format-png",
            "--features tokio,image,image-format-jpeg",
            "--features resolve-path",
            "--features async,resolve-path",
            "--features tokio,resolve-path",
            "--features async,tokio,resolve-path",
            "--features json",
            "--features async,json",
            "--features tokio,json",
            "--features toml",
            "--features async,toml",
            "--features tokio,toml",
            "--features yaml",
            "--features async,yaml",
            "--features tokio,yaml",
            "--features ron",
            "--features async,ron",
            "--features tokio,ron",
            "--features include_dir",
            "--features async,include_dir",
            "--all-features",
        ]

    steps:
      - uses: actions/checkout@v4
    #   - name: Install dependencies
    #     run: sudo apt update && sudo apt install openssl libssl-dev
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.feature-combos == '--all-features' }}
      - name: Run tests
        run: cargo test -p dir-structure --no-default-features ${{ matrix.feature-combos }} -- --test-threads=1
