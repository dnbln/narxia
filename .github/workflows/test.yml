name: Test

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

env:
  CARGO_TERM_COLOR: always
  COLOR: always
  NEXUS_GROUP_BEGIN: "::group::{group}"
  NEXUS_GROUP_END: "::endgroup::"
  CC: clang
  CXX: clang++

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt update && sudo apt install clang ninja-build
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v1
        with:
          crate: cargo-nextest
          args: --locked
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build nexus
        run: cargo build -p nexus
      - name: Cache llvm
        uses: actions/cache/restore@v4
        with:
          key: ${{ runner.os }}-built-llvm
          path: |
            nexusbuild/llvm
      - name: Build llvm
        run: cargo nexus build-sys build --targets llvm
      - name: Save llvm
        uses: actions/cache/save@v4
        with:
          key: ${{ runner.os }}-built-llvm
          path: |
            nexusbuild/llvm
      - name: Build narxia
        run: cargo nexus build-sys build --targets compiler
      - name: Build tests
        run: cargo nexus build-sys build --targets tests
      - name: Test
        run: cargo nexus test --no-fail-fast
      # - name: Build
      #   run: cargo build -p narxia-driver --bin narxia-driver
      # - name: Test
      #   run: cargo nextest run --all
