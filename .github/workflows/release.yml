name: Release

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight

env:
  CARGO_TERM_COLOR: always
  COLOR: always
  NEXUS_GROUP_BEGIN: "::group::{group}"
  NEXUS_GROUP_END: "::endgroup::"
  CC: clang
  CXX: clang++

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup debug environment variables
        if: ${{ runner.debug == '1' }}
        run: |
          echo "NEXUS_DEBUG_NEXTEST_OUTPUT=1" >> $GITHUB_ENV
      - name: Install dependencies
        run: sudo apt update && sudo apt install clang ninja-build openssl libssl-dev
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build nexus
        run: cargo build -p nexus
      - uses: ./.github/actions/build-llvm
      - name: Build distributable package
        run: cargo nexus dist --pkg narxia-linux.zip
      - uses: actions/upload-artifact@v4
        with:
          name: narxia-linux
          path: narxia-linux.zip
  build-macos-arm:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup debug environment variables
        if: ${{ runner.debug == '1' }}
        run: |
          echo "NEXUS_DEBUG_NEXTEST_OUTPUT=1" >> $GITHUB_ENV
      - name: Install dependencies
        run: brew install llvm ninja
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build nexus
        run: cargo build -p nexus
      - uses: ./.github/actions/build-llvm
      - name: Build distributable package
        run: cargo nexus dist --pkg narxia-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: narxia-macos-arm64
          path: narxia-macos-arm64.zip
  build-macos-x86:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4
      - name: Setup debug environment variables
        if: ${{ runner.debug == '1' }}
        run: |
          echo "NEXUS_DEBUG_NEXTEST_OUTPUT=1" >> $GITHUB_ENV
      - name: Install dependencies
        run: brew install llvm ninja
      - name: Install rust
        run: rustup install nightly && rustup default nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build nexus
        run: cargo build -p nexus
      - uses: ./.github/actions/build-llvm
      - name: Build distributable package
        run: cargo nexus dist --pkg narxia-macos-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: narxia-macos-x86_64
          path: narxia-macos-x86_64.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos-arm, build-macos-x86]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: narxia-linux
          path: narxia-linux
      - uses: actions/download-artifact@v4
        with:
          name: narxia-macos-arm64
          path: narxia-macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: narxia-macos-x86_64
          path: narxia-macos-x86_64
      - name: Date
        run: echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: Create release name
        run: echo "RELEASE_NAME=nightly/$TODAY" >> $GITHUB_ENV
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_NAME" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} nightly $TODAY" \
              --generate-notes --prerelease --fail-on-no-commits \
              --discussion-category "Nightly" \
              narxia-linux/narxia-linux.zip \
              narxia-macos-arm64/narxia-macos-arm64.zip \
              narxia-macos-x86_64/narxia-macos-x86_64.zip
